<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Class Check-in Screen</title>
<style>
  /* Projector view: a big QR on the left, the live list of names and times on the right. */
  :root { --bg:#0f1b2d; --panel:#16243a; --ink:#f2f5fa; --muted:#a8b4c7; --accent:#7fb0ff; --ok:#6fd6a0; --line:#25364f; color-scheme:dark; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font:18px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding:24px; }
  .layout { height:100%; display:grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap:28px; }
  @media (max-width: 800px) { .layout { grid-template-columns: minmax(0, 1fr); height:auto; } }
  .left { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; min-width:0; }
  h1 { margin:0; font-size:clamp(28px, 4vw, 52px); letter-spacing:-0.02em; text-align:center; text-wrap:balance; }
  .qr { width:min(100%, 72vh); aspect-ratio:1; max-width:100%; background:#fff; border-radius:18px; padding:18px; display:grid; place-items:center; }
  .qr svg { width:100%; height:auto; display:block; }
  .qr .idle { color:#33415a; font-size:clamp(18px, 2vw, 26px); text-align:center; padding:24px; }
  .bar { width:min(100%, 72vh); height:8px; border-radius:8px; background:var(--line); overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--accent); transform-origin:left; }
  .hint { color:var(--muted); margin:0; text-align:center; }
  .right { background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:22px 24px; min-width:0; display:flex; flex-direction:column; overflow:hidden; }
  .head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; border-bottom:1px solid var(--line); padding-bottom:12px; }
  .count { font-size:clamp(36px, 5vw, 64px); font-weight:700; font-variant-numeric:tabular-nums; line-height:1; }
  .label { color:var(--muted); font-size:15px; text-transform:uppercase; letter-spacing:.08em; }
  ol { list-style:none; margin:0; padding:0; overflow-y:auto; flex:1; columns: 2 240px; column-gap:28px; padding-top:10px; }
  li { break-inside:avoid; display:flex; justify-content:space-between; gap:12px; padding:7px 0; border-bottom:1px solid var(--line); font-size:clamp(16px, 1.5vw, 21px); }
  li .t { color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; }
  li.new { color:var(--ok); }
  .empty { color:var(--muted); padding-top:14px; }
  .status { font-size:14px; color:var(--muted); }
  @media (prefers-reduced-motion: reduce) { .bar > i { transition:none !important; } }
</style>
</head>
<body>
<div class="layout">
  <section class="left">
    <h1>Scan to check in</h1>
    <div class="qr" id="qr"><div class="idle">Connecting to the TA's laptop…</div></div>
    <div class="bar" id="barWrap" hidden><i id="bar"></i></div>
    <p class="hint" id="hint">Open your phone camera and point it at the code.</p>
  </section>
  <section class="right">
    <div class="head">
      <div><div class="count" id="count">0</div><div class="label">checked in</div></div>
      <div class="status" id="status"></div>
    </div>
    <ol id="list"></ol>
    <p class="empty" id="empty">Names will appear here as people check in.</p>
  </section>
</div>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script>
  const room = (new URLSearchParams(location.search).get("r") || "").replace(/[^a-z0-9]/g, "");
  const $ = (id) => document.getElementById(id);
  let lastToken = null, seen = new Set(), peer = null, conn = null, retry = null;

  function idle(text) { $("qr").innerHTML = '<div class="idle"></div>'; $("qr").firstChild.textContent = text; $("barWrap").hidden = true; }

  function apply(s) {
    if (s.live && s.token) {
      if (s.token !== lastToken) {
        lastToken = s.token;
        const q = qrcode(0, "M"); q.addData(location.origin + "/?r=" + s.room + "&t=" + s.token); q.make();
        $("qr").innerHTML = q.createSvgTag({ cellSize: 8, margin: 2, scalable: true });
        $("barWrap").hidden = false;
        const bar = $("bar");
        bar.style.transition = "none"; bar.style.transform = "scaleX(1)";
        requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.transition = "transform " + (s.rotate || 15) + "s linear"; bar.style.transform = "scaleX(0)"; }));
      }
      $("hint").textContent = "Open your phone camera and point it at the code.";
    } else {
      lastToken = null;
      idle(s.names.length ? "Check-in is closed." : "Check-in will open shortly.");
      $("hint").textContent = "";
    }
    $("count").textContent = s.names.length;
    $("list").innerHTML = "";
    s.names.slice().reverse().forEach((n) => {
      const li = document.createElement("li");
      const a = document.createElement("span"); a.textContent = n.name;
      const b = document.createElement("span"); b.className = "t"; b.textContent = n.time;
      li.append(a, b);
      const key = n.name + n.time;
      if (seen.size && !seen.has(key)) li.className = "new";
      $("list").appendChild(li);
    });
    seen = new Set(s.names.map((n) => n.name + n.time));
    $("empty").hidden = s.names.length > 0;
    $("status").textContent = s.live ? "Live" : "";
  }

  function connect() {
    clearTimeout(retry);
    if (!peer || peer.destroyed) {
      peer = new Peer();
      peer.on("open", openConn);
      peer.on("error", (e) => { if (e.type === "peer-unavailable") waiting(); else { peer.destroy(); retry = setTimeout(connect, 4000); } });
      peer.on("disconnected", () => { try { peer.reconnect(); } catch {} });
    } else openConn();
  }
  function openConn() {
    conn = peer.connect("cbs-qr-" + room, { reliable: true });
    conn.on("open", () => conn.send({ type: "display" }));
    conn.on("data", (s) => { if (s && s.type === "state") apply(s); });
    conn.on("close", waiting);
  }
  function waiting() {
    lastToken = null;
    idle("Waiting for the TA's laptop. Check-in will open shortly.");
    $("hint").textContent = "";
    clearTimeout(retry); retry = setTimeout(connect, 4000);
  }

  if (!room) idle("This link is missing its class code. Ask your TA for the classroom-screen link.");
  else connect();
</script>
</body>
</html>
