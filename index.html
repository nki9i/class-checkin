<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Class Check-in</title>
<style>
  :root { --bg:#f6f4ef; --card:#ffffff; --ink:#1d2433; --muted:#6b7280; --accent:#1f4e8c; --ok:#1c7c4b; --err:#b42318; --line:#e5e1d8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171d; --card:#1d2129; --ink:#eef0f4; --muted:#9aa3b2; --accent:#7fa8e6; --ok:#5fcf93; --err:#ff8a7a; --line:#2c323d; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
         font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding:16px; }
  .card { width:100%; max-width:420px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:28px 24px; }
  h1 { margin:0 0 4px; font-size:24px; letter-spacing:-0.01em; }
  p.sub { margin:0 0 22px; color:var(--muted); }
  label { display:block; font-weight:600; margin-bottom:6px; }
  input { width:100%; font:inherit; padding:12px 14px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--ink); }
  input:focus { outline:2px solid var(--accent); outline-offset:1px; }
  button { margin-top:14px; width:100%; font:inherit; font-weight:600; padding:12px; border:0; border-radius:10px; background:var(--accent); color:#fff; cursor:pointer; }
  @media (prefers-color-scheme: dark) { button { color:#0e1320; } }
  button:disabled { opacity:.6; cursor:default; }
  .msg { margin-top:16px; min-height:24px; }
  .err { color:var(--err); }
  .done { text-align:center; }
  .done .big { font-size:40px; color:var(--ok); }
</style>
</head>
<body>
<main class="card" id="card">
  <h1>Class check-in</h1>
  <p class="sub">Enter your full name. You'll be asked to share your location — you must be at Kravis Hall to check in. Use your phone for the best accuracy.</p>
  <form id="f">
    <label for="name">Full name</label>
    <input id="name" name="name" autocomplete="name" required minlength="2" maxlength="80" placeholder="e.g. Jordan Lee">
    <button id="btn" type="submit">Check in</button>
  </form>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>
</main>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script>
  // The check-in goes straight to the TA's open host page. Nothing is stored on any server.
  const room = (new URLSearchParams(location.search).get("room") || "").toLowerCase().replace(/[^a-z0-9-]/g, "");
  const f = document.getElementById("f"), btn = document.getElementById("btn"), msg = document.getElementById("msg");
  if (!room) { msg.className = "msg err"; msg.textContent = "This link is missing its class code. Please use the link your TA posted."; btn.disabled = true; }

  function getLocation() {
    return new Promise((resolve, reject) => {
      if (!("geolocation" in navigator)) return reject(new Error("This browser can't share location. Please use your phone's browser."));
      navigator.geolocation.getCurrentPosition(resolve, (err) => {
        reject(new Error(err && err.code === 1
          ? "Location is required to check in. Allow location for this site in your browser settings, then try again."
          : "Couldn't get your location. Make sure Location Services are on and try again."));
      }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
    });
  }

  function sendToHost(payload) {
    return new Promise((resolve, reject) => {
      const peer = new Peer();
      let done = false;
      const finish = (fn, v) => { if (done) return; done = true; clearTimeout(t); setTimeout(() => peer.destroy(), 500); fn(v); };
      const t = setTimeout(() => finish(reject, new Error("Couldn't reach the check-in screen. Check-in may not be open yet — try again in a moment.")), 20000);
      peer.on("error", (e) => finish(reject, new Error(e && e.type === "peer-unavailable"
        ? "Check-in isn't open right now. Try again when your TA opens it."
        : "Connection problem. Please try again.")));
      peer.on("open", () => {
        const conn = peer.connect("cbs-checkin-" + room, { reliable: true });
        conn.on("open", () => conn.send(payload));
        conn.on("data", (reply) => finish(reply && reply.ok ? resolve : reject, reply && reply.ok ? reply : new Error((reply && reply.error) || "Check-in failed.")));
        conn.on("error", () => finish(reject, new Error("Connection problem. Please try again.")));
      });
    });
  }

  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = document.getElementById("name").value.trim().replace(/\s+/g, " ");
    btn.disabled = true; msg.className = "msg"; msg.textContent = "Getting your location…";
    try {
      const pos = await getLocation();
      msg.textContent = "Checking in…";
      const { latitude: lat, longitude: lng, accuracy } = pos.coords;
      const reply = await sendToHost({ type: "checkin", name, lat, lng, accuracy });
      const card = document.getElementById("card");
      card.innerHTML = '<div class="done"><div class="big">✓</div><h1></h1><p class="sub"></p></div>';
      card.querySelector("h1").textContent = "You're checked in, " + reply.name.split(" ")[0];
      card.querySelector("p").textContent = "Recorded at " + reply.time + ".";
    } catch (err) {
      msg.className = "msg err"; msg.textContent = err.message; btn.disabled = false;
    }
  });
</script>
</body>
</html>
